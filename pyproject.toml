[tool.poetry]
name = "edge-llm-lab"
version = "0.2.0"
description = "Laboratory for evaluating LLMs on edge devices: latency/memory/energy telemetry, structured tool-calling metrics, LLM-judge scoring"
authors = ["Maria Jastrzebska <maria.jastrzebska.ai@gmail.com>"]
packages = [
    { include = "edge_llm_lab", from = "src" }
]
package-mode = true

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
# --- core runtime (llama-server orchestration + Ollama registry) ---
pydantic = "^2.4.2"
pydantic-settings = "^2.8.0"
pyyaml = "^6.0.2"
ollama = "^0.4.7"
llama-cpp-python = "^0.3.16"
httpx = ">=0.27,<0.29"
aiohttp = "^3.11.13"
psutil = "^6.0.0"            # resource telemetry (was used but undeclared)
python-dotenv = "^1.0.0"     # .env loading (was used but undeclared)
loguru = "^0.7.2"
colorama = "^0.4.6"
packaging = "^24.2"
# --- judge / reference generation ---
openai = ">=1.52.0,<2.0.0"
instructor = "^1.7.2"
# --- metrics ---
numpy = "^1.26.0"
pandas = "^2.3.0"
scikit-learn = "^1.6.1"
nltk = "^3.9.1"
rouge-score = "^0.1.2"
python-levenshtein = "^0.27.1"
bert-score = "^0.3.13"
sentence-transformers = "^4.1.0"
transformers = ">=4.44.2"
torch = ">=2.2.0"
huggingface_hub = ">=0.26.0"
# --- statistics (statistical_analysis.py — recovered from framework_moved) ---
scipy = "^1.13.0"
statsmodels = "^0.14.2"
tinydb = "^4.8.0"            # convert_to_tinydb bridge (was used but undeclared)
# --- plotting (until figures move to tidy result frames) ---
seaborn = "^0.13.2"
# --- experiment tracking ---
neptune = "^1.14.0"
mlflow = "^2.20.2"
# --- optimization sweeps ---
optuna-integration = {extras = ["mlflow"], version = "^4.5.0"}

# REMOVED (declared but with zero call sites, inherited from fed-mobile):
# fastapi, uvicorn, starlette, python-multipart, python-jose, passlib,
# flwr, onnx, onnxruntime, coremltools, gguf, boto3, cython, accelerate,
# ipykernel, jupyter. Re-add any of these deliberately if a real use appears.

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.6.0"
pytest-watch = "^4.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
