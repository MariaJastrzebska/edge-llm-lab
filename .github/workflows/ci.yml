name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

# Avoid retaining multi-GB dependency wheels alongside installed packages.
env:
  PIP_NO_CACHE_DIR: "1"

# PR numbers avoid collisions between same-named branches in different forks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # GitHub-hosted test runners do not need CUDA libraries.
        if [ "${{ runner.os }}" = "Linux" ]; then
          pip install torch --index-url https://download.pytorch.org/whl/cpu
        fi
        pip install -e .
        pip install pytest pytest-cov pytest-xdist
    
    - name: Run unit tests
      run: |
        pytest tests/unit tests/test_posthoc.py -v --cov=src/edge_llm_lab --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort mypy
    
    - name: Run Ruff
      run: |
        ruff check src/ tests/ --output-format=github
      continue-on-error: true
    
    - name: Check Black formatting
      run: |
        black --check src/ tests/
      continue-on-error: true
    
    - name: Check isort
      run: |
        isort --check-only src/ tests/
      continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml]
    
    - name: Run Bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, lint]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/

  integration-test:
    name: Inspect AI Replay Integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # GitHub-hosted test runners do not need CUDA libraries.
        if [ "${{ runner.os }}" = "Linux" ]; then
          pip install torch --index-url https://download.pytorch.org/whl/cpu
        fi
        pip install -e .
        pip install -r requirements-inspect.txt pytest
    
    - name: Run Inspect provider and capture replay tests
      run: |
        pytest tests/unit/test_inspect_adapter.py -v

  required:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [test, build, integration-test]
    steps:
    - name: Require tests, build and Inspect replay to pass
      env:
        TEST_RESULT: ${{ needs.test.result }}
        BUILD_RESULT: ${{ needs.build.result }}
        INSPECT_RESULT: ${{ needs.integration-test.result }}
      run: |
        test "$TEST_RESULT" = success
        test "$BUILD_RESULT" = success
        test "$INSPECT_RESULT" = success
